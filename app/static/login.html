<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accesso · Lezionami</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="blob blob-a"></div><div class="blob blob-b"></div></div>
  <main class="wrap login-wrap">
    <div class="login-art">
      <img src="/static/illustrazione.svg" alt="Una ragazza seduta a gambe incrociate legge con calma" width="360" height="320">
    </div>
    <form class="card login-card" id="loginForm">
      <p class="eyebrow">Lezionami</p>
      <h1 class="login-title">Accedi</h1>
      <p class="muted">Inserisci la password per entrare.</p>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" id="password" autocomplete="current-password" required autofocus>
      </label>
      <button type="submit" class="btn btn-primary login-btn" id="loginBtn">Entra</button>
      <p class="form-error" id="loginError" role="alert" hidden></p>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
